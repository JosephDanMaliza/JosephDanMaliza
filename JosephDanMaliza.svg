<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 80" width="100%" height="80">
  <defs>
    <style>
      @keyframes cycleColors {
        0%   { fill: #EF4444; } /* Red */
        25%  { fill: #3B82F6; } /* Blue */
        50%  { fill: #22C55E; } /* Green */
        75%  { fill: #EAB308; } /* Yellow */
        100% { fill: #FFFFFF; } /* White */
      }
      .animated-text {
        font-family: 'Fira Code', 'Courier New', monospace;
        font-size: 40px;
        font-weight: 800;
        text-anchor: middle;
        dominant-baseline: middle;
        animation: cycleColors 5s infinite ease-in-out alternate;
      }
    </style>
  </defs>
  <text x="50%" y="50%" class="animated-text">JosephDanMaliza</text>
</svg>
